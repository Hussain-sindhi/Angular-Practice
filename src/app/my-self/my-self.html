<app-navbar></app-navbar>

<div class="myself-container">
  <h2>Welcome to My Self Page!</h2>

  <div class="card">
    <p><strong>Name:</strong> {{ name }}</p>
    <p><strong>Age:</strong> {{ age }}</p>
    <p><strong>Course:</strong> {{ course }}</p>
    <p><strong>College:</strong> {{ college }}</p>
    
    <div class="actions">
      <a routerLink="/home" class="btn btn-secondary">Home</a>
      <button type="button" class="btn btn-primary" (click)="RouteParams()">Emp Details (101)</button>
    </div>
  </div>
</div>
