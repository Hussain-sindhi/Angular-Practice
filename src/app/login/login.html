
    <div class="login-box">
    <h2>Login</h2>

<form #loginForm="ngForm" (ngSubmit)="onLogin()">
    <div class="form-group">
    <label>Email:</label>
    <input type="email" name="email" [(ngModel)]="email" #emailModel="ngModel" required>
    @if (emailModel.invalid && emailModel.touched) {
        <span class="error">Email is required</span>
    }
    </div><br>

    <div class="form-group">
        <label>Password:</label>
        <input type="password" name="password" [(ngModel)]="password" #passwordModel="ngModel" required>
        @if(passwordModel.invalid && passwordModel.touched) {
            <span class="error">Password is required</span>
        }
    </div>

    <button type="login" [disabled]="loginForm.invalid">Login</button>
    <p class="message">{{ message }}</p>

</form>

    <!-- Signup Link Section -->
    <div class="signup-section">
        <p class="signup-text">Don't have an account?</p>
        <button type="button" class="signup-link" (click)="goToSignup()">Sign Up</button>
    </div>

</div>
